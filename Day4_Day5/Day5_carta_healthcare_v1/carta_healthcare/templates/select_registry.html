<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Carta Healthcare POC — Select Registry</title>
  <style>
    body { background: #0f1115; color: #e6e6e6; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 8px; padding: 32px; width: 420px; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .step { color: #7a8296; font-size: 12px; margin-bottom: 20px; }
    .option { display: block; border: 1px solid #333844; border-radius: 6px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
    .option:hover { border-color: #3b6fe0; }
    .option input { margin-right: 8px; }
    .option-name { font-weight: 600; }
    .option-types { color: #7a8296; font-size: 12px; margin-top: 4px; }
    button { width: 100%; padding: 10px; background: #3b6fe0; border: none; border-radius: 4px; color: white; font-size: 14px; cursor: pointer; margin-top: 8px; }
    button:hover { background: #4a7cf0; }
    .error { color: #ef6a6a; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Carta Healthcare — Clinical Extraction POC</h1>
    <div class="step">Step 2 of 3 — Choose a registry/program</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="{{ url_for('select_registry') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      {% for registry in registries %}
      <label class="option">
        <input type="radio" name="registry_id" value="{{ registry.id }}" required />
        <span class="option-name">{{ registry.name }}</span>
        <div class="option-types">Document types: {{ registry.document_types | join(', ') }}</div>
      </label>
      {% endfor %}
      <button type="submit">Continue</button>
    </form>
  </div>
</body>
</html>
