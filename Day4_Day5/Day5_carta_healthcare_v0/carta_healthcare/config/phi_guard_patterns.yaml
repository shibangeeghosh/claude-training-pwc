# Regex blocklist used by .claude/hooks/check_phi_guard.py.
# Re-read from disk on every Write/Edit into data/ — an independent layer that does not trust
# any agent's self-restraint about keeping sample/reference data synthetic.

patterns:
  - name: ssn
    regex: '\b\d{3}-\d{2}-\d{4}\b'

  - name: mrn_labeled
    regex: '(?i)\bMRN[:#]?\s*\d{5,}\b'

  - name: phone_number
    regex: '\b\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}\b'

  - name: dob_labeled
    regex: '(?i)\bDOB[:]?\s*\d{1,2}/\d{1,2}/\d{2,4}\b'

  - name: full_name_labeled
    regex: '(?i)\bpatient\s+name[:]?\s*[A-Z][a-z]+\s+[A-Z][a-z]+\b'
